name: Workbench Pages preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
      - run: npm run test:pages-browser
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Static preview artifact is ready" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable Settings → Pages → Source: GitHub Actions, then run this workflow again. Site activation needs repository owner permissions." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
